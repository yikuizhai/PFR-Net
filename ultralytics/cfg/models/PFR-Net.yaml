# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-Flash-MRM-Plus (位置消融：MRM 部署在 Head 的 P5 层)
#LSCA

nc: 4

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:

  - [-1, 1, HDPF_Stem, [64, 3, 2]]   # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1 - P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3 - P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5 - P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7 - P5/32
  - [-1, 3, C2f, [1024, True]]       # 8  <-- MRM 外部输入 A (Backbone原始P5)
  - [-1, 1, SPPF, [1024, 5]]         # 9  <-- MRM 外部输入 B (SPPF全局语义)

head:
  # ⬇️ Top-Down 路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]              # 12 - P4_td
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]              # 15 - P3_td

  # ==========================================
  # 🚀 P2 层：4路 MRM 强行越级融合
  # ==========================================
  - [0, 1, Conv, [128, 3, 2]]                  # 16 - P1(H/2) 下采样对齐到 P2(H/4)
  - [15, 1, nn.Upsample, [None, 2, "nearest"]] # 17 - P3_td(H/8) 上采样放大 2倍
  - [12, 1, nn.Upsample, [None, 4, "nearest"]] # 18 - ⚠️ P4_td(H/16) 强行上采样放大 4倍

  # 接收列表: [16(P1降), 2(P2骨干), 17(P3升2x), 18(P4升4x)]
  - [[16, 2, 17, 18], 1, MRM, [128]]           # 19 - 4路算力燃烧
  - [-1, 3, C2f, [128]]                        # 20 - 诞生 P2 超级枢纽

  # ⬆️ Bottom-Up 路径 (从 P2 一路往上重构)
  - [-1, 1, Conv, [256, 3, 2]]           # 21 - P2 下采样
  - [[-1, 15], 1, Concat, [1]]           # 22 - 拼接 P3_td
  - [-1, 3, C2f, [256]]                  # 23 - 新 P3 枢纽

  - [-1, 1, Conv, [512, 3, 2]]           # 24 - P3 下采样
  - [[-1, 12], 1, Concat, [1]]           # 25 - 拼接 P4_td
  - [-1, 3, C2f, [512]]                  # 26 - 新 P4 枢纽

  - [-1, 1, Conv, [1024, 3, 2]]          # 27 - P4 下采样
  - [[-1, 9], 1, Concat, [1]]            # 28 - 拼接 SPPF
  - [-1, 3, C2f, [1024]]                 # 29 - 新 P5 枢纽

  # 🛡️ 非对称去噪净化
  - [23, 1, LSCA, []]   # 30 - 净化 P3
  - [26, 1, LSCA, []]   # 31 - 净化 P4

  # --------- 🎯 Detect ---------
  - [[30, 31, 29], 1, Detect, [nc]]  # 32 - 三头齐射